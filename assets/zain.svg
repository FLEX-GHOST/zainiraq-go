<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="zainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3A6"/>
      <stop offset="50%" stop-color="#212529"/>
      <stop offset="100%" stop-color="#2D1152"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3A6"/>
      <stop offset="100%" stop-color="#00C49F"/>
    </linearGradient>
  </defs>
  <!-- Background subtle badge -->
  <rect width="400" height="120" rx="16" fill="#121316"/>
  <!-- Zain Iraq Emblem Icon -->
  <g transform="translate(36, 24)">
    <circle cx="36" cy="36" r="34" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-dasharray="8 4"/>
    <circle cx="36" cy="36" r="26" fill="#00A3A6" fill-opacity="0.15"/>
    <!-- Stylized Z flourish -->
    <path d="M 22 22 L 50 22 L 22 50 L 50 50" fill="none" stroke="#00C49F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="22" r="3.5" fill="#FFFFFF"/>
    <circle cx="22" cy="50" r="3.5" fill="#00A3A6"/>
  </g>
  <!-- Zain Text and Iraq Tag -->
  <text x="125" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">zain</text>
  <text x="215" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#00C49F" letter-spacing="1">IRAQ</text>
  <text x="126" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#8E8E93" letter-spacing="0.5">عالم جميل • A Wonderful World</text>
</svg>
